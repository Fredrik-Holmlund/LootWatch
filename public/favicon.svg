<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <rect width="120" height="90" fill="#1d1d1d"/>

  <!-- Crown -->
  <path d="M24,52 L24,37 L38,18 L50,30 L60,6 L70,30 L82,18 L96,37 L96,52 Q78,41 60,40 Q42,41 24,52Z"
    fill="#C8A020" stroke="#1a1005" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="50,30 60,6 70,30" fill="#F0D040" opacity="0.6"/>

  <!-- Eye outer (dark lids) -->
  <path d="M4,56 Q60,20 116,56 Q60,92 4,56Z" fill="#1a1005"/>

  <!-- Eye inner (gold) -->
  <path d="M14,56 Q60,28 106,56 Q60,84 14,56Z" fill="#C8A020"/>

  <!-- Iris -->
  <circle cx="60" cy="56" r="17" fill="#8B6008"/>
  <circle cx="60" cy="56" r="17" fill="none" stroke="#D8AE24" stroke-width="2"/>

  <!-- Pupil triangle -->
  <polygon points="46,48 74,48 60,70" fill="#1a1005"/>
</svg>
