<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#151008"/>

  <!-- Eye outline — wide almond, more curve on top -->
  <path d="M4,50 Q50,10 96,50 Q50,82 4,50 Z"
    stroke="#C8A020" stroke-width="4" stroke-linejoin="round"/>

  <!-- Iris -->
  <circle cx="50" cy="50" r="18" fill="#151008" stroke="#C8A020" stroke-width="3"/>

  <!-- Slit pupil — vertical ellipse -->
  <ellipse cx="50" cy="50" rx="5" ry="11" fill="#C8A020"/>
</svg>
