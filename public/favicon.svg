<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#151008"/>

  <!-- Crown (3 peaks, line art) -->
  <path d="M36,40 L30,16 L40,26 L50,7 L60,26 L70,16 L64,40"
    stroke="#C8A020" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Outer eye (curved almond) -->
  <path d="M5,58 Q50,22 95,58 Q50,84 5,58 Z"
    stroke="#C8A020" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner eye (concentric, same tips) -->
  <path d="M5,58 Q50,36 95,58 Q50,72 5,58 Z"
    stroke="#C8A020" stroke-width="2" stroke-linejoin="round"/>

  <!-- Iris ring -->
  <circle cx="50" cy="55" r="12" stroke="#C8A020" stroke-width="2.5"/>

  <!-- Upward triangle ▲ -->
  <polygon points="50,47 43,62 57,62" fill="#C8A020"/>

  <!-- Bottom accent (small downward V below lower tip) -->
  <path d="M44,85 L50,92 L56,85"
    stroke="#C8A020" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
