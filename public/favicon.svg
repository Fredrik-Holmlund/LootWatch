<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 85" fill="none">
  <rect width="100" height="85" fill="#151008"/>

  <!-- Eye dark interior -->
  <path d="M3,55 Q50,22 97,55 Q50,88 3,55Z" fill="#151008"/>

  <!-- Crown -->
  <path d="M13,49 L18,34 L25,42 L33,22 L41,38 L50,8 L59,38 L67,22 L75,42 L82,34 L87,49 Q50,30 13,49Z"
    fill="#C8A020" stroke-linejoin="round"/>

  <!-- Eye outline -->
  <path d="M3,55 Q50,22 97,55 Q50,88 3,55Z"
    stroke="#C8A020" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Crown outline -->
  <path d="M13,49 L18,34 L25,42 L33,22 L41,38 L50,8 L59,38 L67,22 L75,42 L82,34 L87,49"
    stroke="#C8A020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Iris ring -->
  <circle cx="50" cy="55" r="13" fill="#151008" stroke="#C8A020" stroke-width="2.5"/>

  <!-- 12 radial spokes -->
  <g stroke="#C8A020" stroke-width="1.2" stroke-linecap="butt">
    <line x1="50" y1="55" x2="63"   y2="55"/>
    <line x1="50" y1="55" x2="61.3" y2="61.5"/>
    <line x1="50" y1="55" x2="56.5" y2="66.3"/>
    <line x1="50" y1="55" x2="50"   y2="68"/>
    <line x1="50" y1="55" x2="43.5" y2="66.3"/>
    <line x1="50" y1="55" x2="38.7" y2="61.5"/>
    <line x1="50" y1="55" x2="37"   y2="55"/>
    <line x1="50" y1="55" x2="38.7" y2="48.5"/>
    <line x1="50" y1="55" x2="43.5" y2="43.7"/>
    <line x1="50" y1="55" x2="50"   y2="42"/>
    <line x1="50" y1="55" x2="56.5" y2="43.7"/>
    <line x1="50" y1="55" x2="61.3" y2="48.5"/>
  </g>

  <!-- Triangle ▲ -->
  <polygon points="50,47 44,62 56,62" fill="#C8A020"/>
</svg>
