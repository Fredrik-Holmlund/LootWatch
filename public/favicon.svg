<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#151008"/>

  <!-- Crown — floats above eye -->
  <path d="M30,38 L24,14 L37,26 L50,6 L63,26 L76,14 L70,38"
    stroke="#C8A020" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Eye outline — single almond, asymmetric arcs -->
  <path d="M5,62 Q50,26 95,62 Q50,88 5,62 Z"
    stroke="#C8A020" stroke-width="3" stroke-linejoin="round"/>

  <!-- Iris — filled dark circle with gold ring -->
  <circle cx="50" cy="62" r="16" fill="#151008" stroke="#C8A020" stroke-width="2.5"/>

  <!-- Pupil triangle ▲ -->
  <polygon points="50,53 41,70 59,70" fill="#C8A020"/>
</svg>
