<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="18" fill="#151008"/>

  <!-- Crown (3 peaks, line art) -->
  <path d="M37,41 L32,18 L41,26 L50,8 L59,26 L68,18 L63,41"
    stroke="#C8A020" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Outer eye (angular diamond) -->
  <path d="M5,60 L50,33 L95,60 L50,87 Z"
    stroke="#C8A020" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner eye (smaller concentric diamond, same tips) -->
  <path d="M5,60 L50,44 L95,60 L50,76 Z"
    stroke="#C8A020" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Iris ring -->
  <circle cx="50" cy="60" r="13" stroke="#C8A020" stroke-width="2.5"/>

  <!-- Upward triangle ▲ -->
  <polygon points="50,51 43,67 57,67" fill="#C8A020"/>

  <!-- Bottom accent (small downward V below lower tip) -->
  <path d="M44,88 L50,95 L56,88"
    stroke="#C8A020" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
